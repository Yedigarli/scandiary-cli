name: test

# Why three systems: the CLI was first run only on Windows (2026-10-31).
# Linux and macOS find Chrome by different paths, and Ubuntu 24.04 restricts the
# sandbox Chrome uses. A user should not be the first to find out it breaks.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 is the lowest version in "engines"; it lacks test globs, which hid a broken npm test.
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

      # A real scan from the source, against a page we do not control but that is stable.
      - name: Scan from source
        run: node bin/scandiary.mjs https://example.com --pages 1

      # The packed tarball is what npm users get. Testing it catches a missing file in "files".
      - name: Scan from packed tarball
        shell: bash
        run: |
          npm pack
          mkdir ../packed && cd ../packed
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/scandiary-*.tgz
          npx scandiary https://example.com --pages 1

  # Glama starts MCP servers from the Dockerfile. Nothing local runs Docker here, so this
  # job is the only proof that the image builds and that Chromium scans inside it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scandiary-mcp .
      - name: MCP call inside the container
        shell: bash
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          call='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"check_accessibility","arguments":{"url":"https://example.com","pages":1}}}'
          out=$( (printf '%s\n%s\n' "$init" "$call"; sleep 90) | timeout 120 docker run -i --rm scandiary-mcp | head -n 2 )
          echo "$out" | cut -c1-300
          echo "$out" | grep -q '"id":2' || { echo "no reply to the tool call"; exit 1; }
          echo "$out" | grep '"id":2' | grep -q '"isError":true' && { echo "tool returned an error"; exit 1; }
          echo "$out" | grep '"id":2' | grep -q 'roughly a third'
